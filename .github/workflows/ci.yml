name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rubocop --format github

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          # The minor .ruby-version names; setup-ruby takes the newest patch the runner offers
          # (ubuntu-latest has only the latest 4.0.x), while .ruby-version pins what rbenv installs.
          ruby-version: "4.0"
          bundler-cache: true
      - name: Boot the gem with plain Ruby (Rails-free guarantee)
        run: bundle exec ruby -Ilib -e 'require "rook"'
      - name: Run tests
        run: bundle exec rake test
      - name: Run BDD features
        run: bundle exec cucumber --tags "not @wip" --format progress
